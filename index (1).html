{w:'ability',p:'명사 (n.)',m:'능력, 재능',e:'She has the ability to solve problems.',ko:'그녀는 문제를 해결할 능력이 있다.',parts:'able(할 수 있는) + -ity(명사형 접미사)',hint:'-ity는 성질이나 상태를 나타내는 명사를 만드는 접미사예요.',tip:'able(할 수 있는)과 연결해서 기억하세요.'},
{w:'active',p:'형용사 (adj.)',m:'활동적인, 적극적인',e:'My grandfather is still very active.',ko:'우리 할아버지는 여전히 매우 활동적이시다.',parts:'act(행동하다) + -ive(…의 성질을 가진)',hint:'act는 행동하다라는 뜻이고 -ive는 형용사를 만드는 데 자주 쓰여요.',tip:'activity(활동), action(행동)과 같은 어근이에요.'},
{w:'careful',p:'형용사 (adj.)',m:'주의 깊은, 조심하는',e:'Be careful when you cross the street.',ko:'길을 건널 때 조심해.',parts:'care(주의) + -ful(…이 가득한)',hint:'-ful은 “…이 가득한”이라는 뜻을 더해요.',tip:'반대말은 careless(부주의한)예요.'},
{w:'careless',p:'형용사 (adj.)',m:'부주의한',e:'A careless mistake changed the answer.',ko:'부주의한 실수가 답을 바꾸었다.',parts:'care(주의) + -less(…이 없는)',hint:'-less는 “…이 없는”이라는 뜻을 더해요.',tip:'hopeful과 hopeless도 비교해 보세요.'},
{w:'comfortable',p:'형용사 (adj.)',m:'편안한',e:'This chair is comfortable to sit on.',ko:'이 의자는 앉기에 편안하다.',parts:'comfort(편안함) + -able(…할 수 있는)',hint:'-able은 “…할 수 있는”, “…하기에 알맞은”이라는 뜻이에요.',tip:'comfort(편안함, 위로)에서 나온 단어예요.'},
{w:'dangerous',p:'형용사 (adj.)',m:'위험한',e:'It is dangerous to swim here.',ko:'이곳에서 수영하는 것은 위험하다.',parts:'danger(위험) + -ous(…의 성질을 가진)',hint:'-ous는 성질을 나타내는 형용사 접미사예요.',tip:'famous(유명한), nervous(긴장한)도 -ous로 끝나요.'},

{w:'enjoy',p:'동사 (v.)',m:'즐기다',e:'I enjoy reading books after school.',ko:'나는 방과 후에 책 읽는 것을 즐긴다.',parts:'joy(기쁨)와 의미 연결',hint:'joy는 “기쁨”이라는 뜻이에요. enjoy는 단어 전체로 익혀요.',tip:'enjoy 뒤에는 동명사(-ing)가 자주 와요: enjoy reading.'},
{w:'friendly',p:'형용사 (adj.)',m:'친절한, 다정한',e:'Our new teacher is friendly to everyone.',ko:'우리 새 선생님은 모두에게 친절하다.',parts:'friend(친구) + -ly(…의 성질을 가진)',hint:'-ly는 보통 부사를 만들지만 friendly처럼 형용사를 만들기도 해요.',tip:'friendly는 형용사라는 점에 주의하세요.'},
{w:'helpful',p:'형용사 (adj.)',m:'도움이 되는, 유익한',e:'Your advice was very helpful.',ko:'네 조언은 매우 도움이 되었다.',parts:'help(돕다) + -ful(…이 가득한)',hint:'help에 -ful이 붙어 “도움이 되는”이라는 뜻이 돼요.',tip:'helpful advice는 “도움이 되는 조언”이에요.'},
{w:'impossible',p:'형용사 (adj.)',m:'불가능한',e:'It is impossible to finish everything in one minute.',ko:'1분 안에 모든 것을 끝내는 것은 불가능하다.',parts:'im-(아닌, 반대) + possible(가능한)',hint:'im-은 일부 단어에서 반대 의미를 만들어요.',tip:'possible(가능한)과 impossible(불가능한)을 짝으로 기억하세요.'},
{w:'important',p:'형용사 (adj.)',m:'중요한',e:'Sleep is important for your health.',ko:'수면은 건강에 중요하다.',parts:'important는 “중요한”이라는 뜻의 형용사',hint:'단어 구성만 억지로 나누기보다 문장과 함께 익히세요.',tip:'important for ~는 “~에 중요하다”라는 표현이에요.'},
{w:'information',p:'명사 (n.)',m:'정보',e:'You can find more information online.',ko:'온라인에서 더 많은 정보를 찾을 수 있다.',parts:'inform(알리다) + -ation(명사형 접미사)',hint:'-ation은 행동이나 결과를 나타내는 명사를 만들어요.',tip:'information은 보통 셀 수 없는 명사예요: some information.'},
{w:'kindness',p:'명사 (n.)',m:'친절, 다정함',e:'Thank you for your kindness.',ko:'친절하게 대해 주셔서 감사합니다.',parts:'kind(친절한) + -ness(성질·상태)',hint:'-ness는 형용사를 명사로 바꾸어 성질이나 상태를 나타내요.',tip:'kind(친절한) → kindness(친절)로 연결하세요.'},
{w:'possible',p:'형용사 (adj.)',m:'가능한',e:'Is it possible to meet tomorrow?',ko:'내일 만나는 것이 가능할까?',parts:'possible은 “가능한”이라는 뜻의 형용사',hint:'-ible은 일부 형용사에서 “…할 수 있는”이라는 의미를 나타내요.',tip:'possible과 impossible은 반대말이에요.'},
{w:'prepare',p:'동사 (v.)',m:'준비하다',e:'We should prepare for the test.',ko:'우리는 시험을 준비해야 한다.',parts:'prepare for(…을 준비하다)',hint:'pre-는 “미리, 앞서”라는 뜻으로 쓰이는 경우가 있어요.',tip:'preview(미리 보기), prepay(선불하다)와 연결해 보세요.'},
{w:'reusable',p:'형용사 (adj.)',m:'재사용할 수 있는',e:'Please bring a reusable water bottle.',ko:'재사용할 수 있는 물병을 가져오세요.',parts:'re-(다시) + use(사용하다) + -able(…할 수 있는)',hint:'re-는 “다시”, -able은 “…할 수 있는”이라는 뜻이에요.',tip:'reuse(재사용하다) + able로 나누어 보세요.'},
{w:'unhappy',p:'형용사 (adj.)',m:'불행한, 기분이 좋지 않은',e:'He felt unhappy about the result.',ko:'그는 그 결과에 기분이 좋지 않았다.',parts:'un-(아닌, 반대) + happy(행복한)',hint:'un-은 형용사 앞에서 반대 의미를 만들 수 있어요.',tip:'happy와 unhappy를 비교하세요.'},
{w:'useful',p:'형용사 (adj.)',m:'유용한, 쓸모 있는',e:'This website is useful for learning English.',ko:'이 웹사이트는 영어 학습에 유용하다.',parts:'use(사용하다) + -ful(…이 가득한)',hint:'use에 -ful이 붙어 “쓸모가 있는”이라는 뜻이 돼요.',tip:'useless는 “쓸모없는”이라는 반대 의미예요.'}

{s:'She has the ____ to solve difficult problems.',a:'ability',options:['ability','activity','danger','kindness'],ko:'그녀는 어려운 문제를 해결할 능력이 있다.',h:'able(할 수 있는) + -ity(명사형 접미사)'},
{s:'Please be ____ when you cross the street.',a:'careful',options:['careless','comfortable','careful','friendly'],ko:'길을 건널 때 조심하세요.',h:'care(주의) + -ful(…이 가득한)'},
{s:'The two pictures look completely ____.',a:'different',options:['important','different','active','possible'],ko:'두 그림은 완전히 달라 보인다.',h:'differ(다르다) + -ent'},
{s:'It is ____ to see every star clearly on a cloudy night.',a:'impossible',options:['useful','comfortable','possible','impossible'],ko:'흐린 밤에 모든 별을 선명하게 보는 것은 불가능하다.',h:'im-(아닌) + possible(가능한)'},
{s:'You can find more ____ about the school online.',a:'information',options:['information','kindness','ability','decision'],ko:'학교에 관한 더 많은 정보를 온라인에서 찾을 수 있다.',h:'inform(알리다) + -ation(명사형 접미사)'},
{s:'Our new teacher is ____ and kind to everyone.',a:'friendly',options:['dangerous','friendly','careless','unhappy'],ko:'우리 새 선생님은 모두에게 친절하고 다정하다.',h:'friend(친구) + -ly'},
{s:'We should ____ for the test before Friday.',a:'prepare',options:['enjoy','decide','prepare','reuse'],ko:'우리는 금요일 전에 시험을 준비해야 한다.',h:'prepare for(…을 준비하다)'},
{s:'A ____ bottle can be used many times.',a:'reusable',options:['dangerous','reusable','impossible','active'],ko:'재사용 가능한 병은 여러 번 사용할 수 있다.',h:'re-(다시) + use(사용하다) + -able'},
{s:'Your advice was clear and very ____.',a:'helpful',options:['helpful','careless','unhappy','different'],ko:'네 조언은 명확했고 매우 도움이 되었다.',h:'help(돕다) + -ful'},
{s:'Small acts of ____ can make someone’s day better.',a:'kindness',options:['kindness','information','ability','danger'],ko:'작은 친절한 행동이 누군가의 하루를 더 좋게 만들 수 있다.',h:'kind(친절한) + -ness(성질·상태)'}
];
let step=1,wi=0,qi=0,choiceResults={},inputResults={},answers=Array(10).fill(''),checked=false,hints=[];
const STORAGE_KEY='wordStepsSmartReviewV1';
let store=loadStore();
function loadStore(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{records:{},sessions:[],sentenceScore:null}}catch(e){return {records:{},sessions:[],sentenceScore:null}}}
function saveStore(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}catch(e){console.warn('학습 기록을 저장하지 못했습니다.',e)}}
function recordFor(word){return store.records[word]||(store.records[word]={word,correct:0,wrong:0,confidence:0,attempts:0,streak:0,interval:0,due:todayKey(),lastSeen:null,lastCorrect:null})}
function dateAt(offset){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return d}
function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(key){if(!key)return '미학습';let [y,m,d]=key.split('-');return `${y}.${m}.${d}`}
function dueWords(){let today=todayKey();return words.filter(w=>{let r=store.records[w.w];return r&&r.attempts>0&&r.due<=today})}
function nextDate(interval){return todayKey(dateAt(interval))}
function logAttempt(word,ok,confidence){let r=recordFor(word);r.attempts++;r.lastSeen=todayKey();r.confidence=Number(confidence||2);if(ok){r.correct++;r.streak++;r.lastCorrect=todayKey();let base=[1,3,7,14,30];r.interval=r.streak<=1?1:r.streak===2?3:r.streak===3?7:r.streak===4?14:30;if(r.confidence===1)r.interval=Math.max(1,Math.floor(r.interval/2));r.due=nextDate(r.interval)}else{r.wrong++;r.streak=0;r.interval=1;r.due=nextDate(1)}saveStore()}
function progress(){let n=step===1?25:step===2?50:step===3?75:100;$('bar').style.width=n+'%';$('pct').textContent=step===4?'복습과 기록':`학습 단계 ${step} / 4`;document.querySelectorAll('.tab').forEach(b=>{let s=+b.dataset.step;b.classList.toggle('active',s===step);b.classList.toggle('done',s<step)})}
function go(n){step=n;progress();render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(+b.dataset.step));
function head(k,title,desc,badge){return `<div class="head"><div><div class="eyebrow">${k}</div><h2>${title}</h2><p class="sub">${desc}</p></div><span class="badge">${badge}</span></div>`}
function render(){progress();if(step===1)learn();if(step===2)quiz();if(step===3)sentences();if(step===4)dashboard()}
function learn(){let x=words[wi];$('main').innerHTML=head('STEP 01 · LEARN','단어 익히기','뜻과 품사를 확인하고 단어 구성 요소를 살펴보세요.',`${wi+1} / 20`)+
`<section class="card"><div class="word">${x.w}</div><span class="pos">${x.p}</span><div class="meaning">${x.m}</div><div class="example"><b>${x.e}</b><div id="translation" style="display:none;margin-top:6px;color:#657087">${x.ko}</div></div><div class="controls"><button class="ghost" id="trans">예문 해석 보기</button></div><div class="notes"><div class="note"><strong>🔎 단어 구성</strong><p>${x.parts}</p></div><div class="note"><strong>💡 기억 팁</strong><p>${x.tip}</p></div></div><p class="mini" style="margin-top:12px">학습을 마친 뒤 뜻을 가리고 직접 떠올려 보세요. 학습한 단어는 복습 목록에 자동 등록됩니다.</p></section>
<div class="row"><button class="secondary" id="prev" ${wi===0?'disabled':''}>← 이전 단어</button><span class="muted">단어를 소리 내어 읽어 보세요.</span><button class="primary" id="next">${wi===19?'뜻 확인 단계로 →':'다음 단어 →'}</button></div>`;
$('trans').onclick=()=>{let t=$('translation');t.style.display=t.style.display==='none'?'block':'none';$('trans').textContent=t.style.display==='none'?'예문 해석 보기':'해석 숨기기'};$('prev').onclick=()=>{wi--;learn()};$('next').onclick=()=>wi<19?(wi++,learn()):go(2)}
function quiz(){
 const x=words[qi],mode=qi%2===0?'choice':'input',cr=choiceResults[qi],ir=inputResults[qi];
 let confidence=ir?ir.confidence:(cr?cr.confidence:2);
 let body=mode==='choice'?`<h3>알맞은 뜻을 선택하세요</h3><div class="word" style="font-size:30px;margin-bottom:14px">${x.w}</div><div class="choices">${[x.m,...words.filter((w,i)=>i!==qi).slice(0,3).map(w=>w.m)].sort((a,b)=>a.localeCompare(b,'ko')).map(o=>`<button class="choice" data-o="${o}" ${cr!==undefined?'disabled':''}>${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`:
`<h3>뜻을 직접 입력하세요</h3><p class="sub" style="margin-bottom:12px">단어의 한국어 뜻을 입력하세요.</p><input class="field" id="mi" placeholder="한국어 뜻 입력" value="${ir?esc(ir.value):''}" ${ir?'disabled':''}><div class="controls"><button class="primary" id="check" ${ir?'disabled':''}>정답 확인</button></div><div id="feedback" class="feedback ${ir?'show '+(ir.ok?'good':'bad'):''}">${ir?(ir.ok?'정답이에요!':'정답: '+x.m):''}</div>`;
 $('main').innerHTML=head('STEP 02 · RECALL','뜻 확인하기',`홀수 번째 단어는 객관식, 짝수 번째 단어는 직접 입력 방식입니다. 답을 고르기 전에 확신도를 선택해 보세요.`,`${qi+1} / 20`)+
`<section class="quizcard">${body}<div style="margin-top:16px;font-weight:750">답을 제출하기 전, 얼마나 확신하나요?</div><div class="confidence"><button data-conf="1" class="${confidence===1?'selected':''}" ${cr!==undefined||ir?'disabled':''}>잘 모르겠어요</button><button data-conf="2" class="${confidence===2?'selected':''}" ${cr!==undefined||ir?'disabled':''}>조금 헷갈려요</button><button data-conf="3" class="${confidence===3?'selected':''}" ${cr!==undefined||ir?'disabled':''}>확실해요</button></div><div class="controls"><button class="secondary" id="hint">어근·접사 힌트</button></div><div id="hintbox" class="hint">${x.hint}</div></section>
<div class="row"><button class="secondary" id="back" ${qi===0?'disabled':''}>← 이전 단어</button><span class="muted">${mode==='choice'?'객관식':'직접 입력'} · ${qi%2===0?'홀수':'짝수'} 번째</span><button class="primary" id="nextq">${qi===19?'문장 완성 단계로 →':'다음 단어 →'}</button></div>
<div class="row"><span class="muted">맞힌 문제: ${Object.values(choiceResults).filter(v=>v.ok).length+Object.values(inputResults).filter(v=>v.ok).length} / 20</span><button class="ghost" id="reset">이 단계 다시 시작</button></div>`;
 let conf=2;document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{conf=+b.dataset.conf;document.querySelectorAll('[data-conf]').forEach(c=>c.classList.toggle('selected',c===b))});
 if(mode==='choice'){
 if(cr!==undefined){document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.o===x.m)b.classList.add('correct');if(!cr.ok&&b.dataset.o===cr.selected)b.classList.add('wrong')});feedback(cr.ok?'정답이에요!':'아쉬워요. 정답: '+x.m,cr.ok)}
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(choiceResults[qi]!==undefined)return;let ok=b.dataset.o===x.m;choiceResults[qi]={ok,selected:b.dataset.o,confidence:conf};logAttempt(x.w,ok,conf);document.querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(c.dataset.o===x.m)c.classList.add('correct');if(c===b&&!ok)c.classList.add('wrong')});document.querySelectorAll('[data-conf]').forEach(c=>c.disabled=true);feedback(ok?'정답이에요!':'아쉬워요. 정답: '+x.m,ok)});
 }else{
 if(ir)feedback(ir.ok?'정답이에요!':'정답: '+x.m,ir.ok);
 $('check').onclick=()=>{let v=$('mi').value.trim();if(!v){$('mi').focus();return}let ok=x.m.split(/[，,]/).some(s=>{let a=s.trim().replace(/\s/g,'');let b=v.replace(/\s/g,'');return b.includes(a)||a.includes(b)});inputResults[qi]={value:v,ok,confidence:conf};logAttempt(x.w,ok,conf);$('mi').disabled=true;$('check').disabled=true;document.querySelectorAll('[data-conf]').forEach(c=>c.disabled=true);feedback(ok?'정답이에요!':'정답: '+x.m,ok)};
 }
 $('hint').onclick=()=>$('hintbox').classList.toggle('show');$('back').onclick=()=>{qi--;quiz()};$('nextq').onclick=()=>qi<19?(qi++,quiz()):go(3);$('reset').onclick=()=>{if(confirm('2단계 화면의 답안을 초기화할까요? 이미 저장된 학습 기록은 유지됩니다.')){choiceResults={};inputResults={};qi=0;quiz()}};
 function feedback(text,ok){let f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.textContent=text}
}
function sentences(){
 let score=qs.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);
 $('main').innerHTML=head('STEP 03 · IN CONTEXT','문장 완성하기','문맥에 맞는 단어를 선택하세요. 전체 채점 후 해석을 확인할 수 있습니다.','10 QUESTIONS')+
`<div class="summary"><div><div class="eyebrow">YOUR RESULT</div><div>현재 채점 결과</div></div><strong>${checked?score+' / 10':'아직 채점 전'}</strong></div>`+
qs.map((q,i)=>`<section class="question"><div class="qnum">QUESTION ${String(i+1).padStart(2,'0')}</div><div class="sentence">${q.s.replace('____',`<span class="blank">${answers[i]?esc(answers[i]):'______'}</span>`)}</div><div class="choices">${q.options.map(o=>`<button class="choice ${checked&&o===q.a?'correct':''} ${checked&&answers[i]===o&&o!==q.a?'wrong':''}" data-q="${i}" data-o="${o}" ${checked?'disabled':''}>${o}</button>`).join('')}</div><div class="controls"><button class="secondary hintq" data-i="${i}" ${checked?'disabled':''}>힌트</button></div><div class="hint ${hints[i]?'show':''}" id="h${i}">${q.h}</div><div class="feedback ${checked?'show '+(answers[i]===q.a?'good':'bad'):''}">${checked?(answers[i]===q.a?'정답! ':'정답: '+q.a+' · ')+q.ko:''}</div></section>`).join('')+
`<div class="row"><button class="secondary" id="toquiz">← 2단계로</button><button class="primary" id="grade" ${checked?'disabled':''}>전체 채점하기</button><button class="ghost" id="again">다시 풀기</button><button class="ghost" id="dash">복습 · 기록 보기</button></div>`+
(checked?`<div class="feedback show ${score===10?'good':'bad'}">${score===10?'완벽해요! 문맥 속에서 단어를 잘 활용했어요.':`총 ${score}문제를 맞혔어요. 정답과 해석을 확인하고 다시 도전해 보세요.`}</div>`:'');
 document.querySelectorAll('.choice[data-q]').forEach(b=>b.onclick=()=>{if(!checked){let i=+b.dataset.q;answers[i]=b.dataset.o;sentences()}});
 document.querySelectorAll('.hintq').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;hints[i]=!hints[i];$('h'+i).classList.toggle('show',hints[i])});
 $('toquiz').onclick=()=>go(2);$('dash').onclick=()=>go(4);$('grade').onclick=()=>{checked=true;let s=qs.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);store.sentenceScore={score:s,total:qs.length,date:todayKey()};saveStore();sentences()};$('again').onclick=()=>{answers=Array(10).fill('');checked=false;hints=[];sentences()};
}
function dashboard(){let due=dueWords(),learned=words.filter(w=>store.records[w.w]&&store.records[w.w].attempts>0).length;let all=Object.values(store.records),attempts=all.reduce((a,r)=>a+r.attempts,0),correct=all.reduce((a,r)=>a+r.correct,0),rate=attempts?Math.round(correct/attempts*100):0;let upcoming=words.filter(w=>store.records[w.w]).sort((a,b)=>store.records[a.w].due.localeCompare(store.records[b.w].due)).slice(0,8);
 $('main').innerHTML=head('STEP 04 · SMART REVIEW','복습 · 나의 학습 기록','학습 기록을 바탕으로 오늘 복습할 단어를 확인하세요. 기록은 이 브라우저에 자동 저장됩니다.','MY LEARNING')+
`<div class="stats"><div class="stat"><small>오늘 복습할 단어</small><strong>${due.length}</strong></div><div class="stat"><small>학습 기록이 있는 단어</small><strong>${learned} / 20</strong></div><div class="stat"><small>누적 정답률</small><strong>${rate}%</strong></div><div class="stat"><small>누적 풀이 횟수</small><strong>${attempts}</strong></div></div>
<section class="quizcard"><div class="head"><div><h2 style="margin:0">오늘의 복습</h2><p class="sub">정답을 먼저 보지 말고 뜻을 떠올려 보세요.</p></div><span class="due-label">${due.length}개 대기</span></div>${due.length?due.map(w=>{let r=store.records[w.w];return `<div class="review-item"><div><strong>${w.w}</strong><p>${w.p} · 마지막 학습 ${formatDate(r.lastSeen)}</p></div><button class="primary review-one" data-word="${w.w}">복습하기</button></div>`}).join(''):`<div class="empty">오늘 예정된 복습이 없어요.<br>새 단어를 학습하거나 아래 예정 목록을 확인해 보세요.</div>`}<div class="row"><button class="primary" id="startreview" ${due.length?'':'disabled'}>오늘 복습 시작하기</button><button class="secondary" id="newlearn">새 단어 학습하기</button></div></section>
<section class="quizcard" style="margin-top:16px"><h2 style="margin:0 0 5px">다음 복습 일정</h2><p class="sub">정답 여부와 확신도에 따라 복습 간격이 조정됩니다.</p>${upcoming.length?upcoming.map(w=>{let r=store.records[w.w];let isDue=r.due<=todayKey();return `<div class="review-item"><div><strong>${w.w}</strong><p>복습 간격: ${r.interval||1}일 · 연속 정답: ${r.streak}회</p></div><span class="${isDue?'due-label':'badge'}">${isDue?'복습 예정':formatDate(r.due)}</span></div>`}).join(''):`<div class="empty">아직 학습 기록이 없습니다. 2단계 문제를 풀면 복습 일정이 만들어져요.</div>`}</section>
<section class="quizcard" style="margin-top:16px"><h2 style="margin:0 0 5px">학습 기록 요약</h2><p class="sub">문장 완성 점수와 단어 학습 결과를 확인할 수 있어요.</p><div class="review-item"><div><strong>문장 완성하기</strong><p>${store.sentenceScore?`최근 점수 ${store.sentenceScore.score} / ${store.sentenceScore.total} · ${formatDate(store.sentenceScore.date)}`:'아직 채점 기록이 없습니다.'}</p></div><button class="secondary" id="sentencego">문제 풀기</button></div><div class="row"><button class="ghost" id="export">학습 기록 CSV 다운로드</button><button class="ghost" id="clearrecords">모든 기록 초기화</button></div></section>`;
 $('startreview').onclick=()=>startReview(due.map(w=>w.w));$('newlearn').onclick=()=>go(1);$('sentencego').onclick=()=>go(3);document.querySelectorAll('.review-one').forEach(b=>b.onclick=()=>startReview([b.dataset.word]));$('export').onclick=exportCSV;$('clearrecords').onclick=()=>{if(confirm('저장된 학습 기록과 복습 일정을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){store={records:{},sessions:[],sentenceScore:null};saveStore();dashboard()}};
}
let reviewQueue=[],reviewIndex=0,reviewConfidence=2;
function startReview(list){reviewQueue=list.slice();reviewIndex=0;renderReview()}
function renderReview(){if(reviewIndex>=reviewQueue.length){step=4;progress();$('main').innerHTML=head('REVIEW COMPLETE','복습 완료!','오늘 예정된 복습을 모두 마쳤어요. 꾸준히 기억을 꺼내 보는 것이 중요합니다.','DONE')+`<div class="summary"><div><div class="eyebrow">TODAY</div><div>완료한 복습 단어</div></div><strong>${reviewQueue.length}개</strong></div><div class="row"><button class="primary" id="backdash">학습 현황 보기</button><button class="secondary" id="morelearn">새 단어 학습하기</button></div>`;$('backdash').onclick=()=>go(4);$('morelearn').onclick=()=>go(1);return}let w=words.find(x=>x.w===reviewQueue[reviewIndex]);if(!w){reviewIndex++;renderReview();return}reviewConfidence=2;let r=recordFor(w.w);$('main').innerHTML=head('SPACED REVIEW','기억을 꺼내 보세요','먼저 뜻을 떠올린 뒤 정답을 확인하고, 얼마나 확신했는지 표시하세요.',`${reviewIndex+1} / ${reviewQueue.length}`)+`<section class="card"><div class="word">${w.w}</div><span class="pos">${w.p}</span><p class="sub" style="margin-top:14px">한국어 뜻을 머릿속으로 떠올려 보세요. 바로 정답을 확인하기 전에 잠깐 생각해 보세요.</p><div class="confidence" id="reviewConfidence"><button data-rc="1">잘 모르겠어요</button><button data-rc="2" class="selected">조금 헷갈려요</button><button data-rc="3">확실해요</button></div><div id="revealed" style="display:none"><div class="meaning">${w.m}</div><div class="example"><b>${w.e}</b><div style="margin-top:6px;color:#657087">${w.ko}</div></div><p class="mini" style="margin-top:10px">자신의 첫 번째 기억과 비교해 보세요. 실제로 떠올렸는지 솔직하게 선택하는 것이 도움이 됩니다.</p><div class="controls"><button class="primary" id="knew">뜻을 기억했어요</button><button class="secondary" id="forgot">기억이 잘 안 났어요</button></div></div><div class="row"><button class="secondary" id="showanswer">정답 확인</button></div></section><div class="row"><button class="ghost" id="cancelreview">복습 종료</button><span class="muted">다음 복습: ${formatDate(r.due)}</span></div>`;
 document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{reviewConfidence=+b.dataset.rc;document.querySelectorAll('[data-rc]').forEach(c=>c.classList.toggle('selected',c===b))});$('showanswer').onclick=()=>{$('revealed').style.display='block';$('showanswer').disabled=true};$('knew').onclick=()=>finishReview(w,true);$('forgot').onclick=()=>finishReview(w,false);$('cancelreview').onclick=()=>go(4)}
function finishReview(w,ok){logAttempt(w.w,ok,reviewConfidence);reviewIndex++;renderReview()}
function exportCSV(){let rows=[['word','meaning','attempts','correct','wrong','confidence','streak','interval_days','next_review','last_seen']];words.forEach(w=>{let r=store.records[w.w];if(r)rows.push([w.w,w.m,r.attempts,r.correct,r.wrong,r.confidence,r.streak,r.interval,r.due,r.lastSeen])});let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='word-steps-learning-records.csv';a.click();URL.revokeObjectURL(url)}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
